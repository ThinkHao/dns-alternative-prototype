name: DNS MVP platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run DNS integration checks
        run: python verify_mvp.py

      - name: Check POSIX launcher syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n run.sh

      - name: Check PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'run.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  container-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container image
        run: docker compose build

  dnsdist-engine:
    name: dnsdist config and runtime smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install dnsdist 2.1 from the PowerDNS repository
        shell: bash
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://repo.powerdns.com/FD380FBB-pub.asc -o /tmp/dnsdist-pub.asc
          sudo install -m 0644 /tmp/dnsdist-pub.asc /etc/apt/keyrings/dnsdist-21-pub.asc
          echo 'deb [signed-by=/etc/apt/keyrings/dnsdist-21-pub.asc] http://repo.powerdns.com/ubuntu noble-dnsdist-21 main' | sudo tee /etc/apt/sources.list.d/dnsdist.list >/dev/null
          printf 'Package: dnsdist*\nPin: origin repo.powerdns.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/dnsdist-21 >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dnsdist

      - name: Check generated config and run DNS smoke queries
        run: python verify_dnsdist.py
